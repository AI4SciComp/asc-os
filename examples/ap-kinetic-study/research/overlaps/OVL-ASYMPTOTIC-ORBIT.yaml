api_version: ai4scicomp.research/v1
kind: ResearchOverlap
metadata: {id: OVL-ASYMPTOTIC-ORBIT, title: Limit identifier agreement, status: active, labels: []}
spec:
  left: CTX-ASYMPTOTIC
  right: CTX-ORBIT
  checks:
    - id: limit-system-id
      type: value_equal
      left: {file: research/contexts/asymptotic/state.yaml, pointer: /limit_system_id}
      right: {file: research/contexts/orbit/state.yaml, pointer: /target_limit_system_id}
    - id: limit-claim
      type: claim_status_at_least
      reference: CLM-LIMIT-SYSTEM
      minimum_status: verified
  failure_policy: block_gluing
